name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests (zero dependency: no install step)
        run: npm test

      - name: Security lint — forbid eval/Function/innerHTML/document.write in shipped code
        run: |
          set -euo pipefail
          if grep -RInE '\beval\s*\(|new[[:space:]]+Function\s*\(|\.innerHTML[[:space:]]*=|document\.write\s*\(' \
              --include='*.js' js/; then
            echo "Forbidden pattern found in js/ (see above)."
            exit 1
          fi
          echo "No forbidden pattern found in js/."

      - name: Forbid third-party runtime scripts beyond the official Grist plugin API
        run: |
          set -euo pipefail
          if grep -oE '<script[^>]*src="[^"]*"' index.html \
              | grep -v 'src="https://docs.getgrist.com/grist-plugin-api.js"' \
              | grep -v 'src="js/app.js"'; then
            echo "Unexpected external script reference in index.html."
            exit 1
          fi
          echo "Only the expected scripts are referenced."

      # From here on: Playwright, a devDependency used only for this browser
      # regression suite (never shipped — see .github/workflows/pages.yml's
      # file list and SECURITY.md's "Dépendances"). The two npm-test-only
      # steps above stay install-free.
      - name: Install devDependencies (Playwright, for the browser test below)
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests (index.html/harness.html actually rendered in a browser)
        run: npm run test:browser
