name: CI

on:
  push:
    branches-ignore: ["main"] # main goes through pages.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Unit tests and security lint
        run: npm test
      - name: Install the dev dependencies (Playwright)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  grist:
    name: Tests against a real Grist
    runs-on: ubuntu-latest
    services:
      grist:
        image: gristlabs/grist:1.7.20@sha256:c862d4c1ffa2a36009d69b72e7ab319155c3529da7df2de0a4e437e994cfe7f1
        ports:
          - 8484:8484
        env:
          APP_HOME_URL: http://localhost:8484
          GRIST_DEFAULT_EMAIL: ci@example.com
          GRIST_IN_SERVICE: "true"
          GRIST_SANDBOX_FLAVOR: unsandboxed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Grist
        run: timeout 90 sh -c 'until curl -fs http://localhost:8484/status; do sleep 1; done'
      - run: npm run test:grist
