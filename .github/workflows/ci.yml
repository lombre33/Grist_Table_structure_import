name: CI

on:
  push:
    branches-ignore: ["main"] # main goes through pages.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Unit tests and security lint
        run: npm test
      - name: Install the dev dependencies (Playwright, axe-core)
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:browser

  grist:
    name: Tests against Grist ${{ matrix.grist.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the whole suite passes on, the stable one and a development build; pinned by digest, like the actions (README.md)
        grist:
          - name: "1.2.1"
            image: gristlabs/grist:1.2.1@sha256:a96916d6a70601ab86fba6eb1fef7023b206001f023622c4f22616ecfd01588c
          - name: "1.7.20"
            image: gristlabs/grist:1.7.20@sha256:c862d4c1ffa2a36009d69b72e7ab319155c3529da7df2de0a4e437e994cfe7f1
          - name: "development build of 2026-10-01"
            image: gristlabs/grist@sha256:0a927acfeddaffcb412d75d670bbc3bf0a81f8368a19ef1e8478ad45e1ec1f69
    services:
      grist:
        image: ${{ matrix.grist.image }}
        ports:
          - 8484:8484
        env:
          APP_HOME_URL: http://localhost:8484
          GRIST_DEFAULT_EMAIL: ci@example.com
          GRIST_IN_SERVICE: "true"
          GRIST_SANDBOX_FLAVOR: unsandboxed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Grist
        run: timeout 90 sh -c 'until curl -fs http://localhost:8484/status; do sleep 1; done'
      - run: npm run test:grist
