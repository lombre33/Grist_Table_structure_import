name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published site (widget runtime files only)
        run: |
          set -euo pipefail
          mkdir -p _site/js _site/fonts/manrope _site/assets
          cp index.html style.css favicon.svg _site/
          cp js/*.js _site/js/
          cp fonts/manrope/Manrope-Variable.ttf fonts/manrope/OFL.txt _site/fonts/manrope/
          cp assets/grist-factory-logo.jpg _site/assets/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
