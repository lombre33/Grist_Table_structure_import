name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published site (widget runtime files only)
        run: |
          set -euo pipefail
          mkdir -p _site/js _site/fonts/manrope _site/assets
          cp index.html style.css favicon.svg _site/
          cp js/*.js _site/js/
          cp fonts/manrope/Manrope-Variable.ttf fonts/manrope/OFL.txt _site/fonts/manrope/
          cp assets/grist-factory-logo.jpg _site/assets/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
